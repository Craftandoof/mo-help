name: Build Mo'Help

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach files to a GitHub Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin bundle
        run: npm run build

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $PKG"; exit 1
          fi

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: mo_help
          path: |
            dist/mo_help.js
            dist/about.md
            dist/icon.png
            dist/members.yml
            dist/LICENSE.MD
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/mo_help.js dist/about.md dist/icon.png \
            --title "Mo'Help ${GITHUB_REF_NAME}" --generate-notes
